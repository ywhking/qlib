# Alpha158 + 换手率特征配置
qlib_init:
    provider_uri: "~/.qlib/qlib_data/akshare_data"
    region: cn

market: &market all
benchmark: &benchmark SH000300

# 数据处理器配置 - 关键修改：添加 turnover 字段
data_handler_config: &data_handler_config
    start_time: 2015-01-01
    end_time: 2025-12-31
    fit_start_time: 2015-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    # 关键：添加 turnover 到 fields
    fields: ["$open", "$close", "$high", "$low", "$volume", "$amount", "$turnover", "$outstanding_share"]

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2015-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-12-31]
                test: [2025-01-01, 2025-12-31]
    
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252

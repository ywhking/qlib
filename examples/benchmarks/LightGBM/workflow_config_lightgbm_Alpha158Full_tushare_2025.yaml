qlib_init:
    # provider_uri: "E:\\myprojects\\quant_data\\qlib_data\\tushare_data"
    provider_uri: "~/.qlib/qlib_data/tushare_data"
    region: cn
market: &market csi1000
benchmark: &benchmark SH600000
data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2025-12-31
    fit_start_time: 2018-01-01
    fit_end_time: 2023-12-31
    instruments: *market
    infer_processors:
        - {"class": "ProcessInf", "kwargs": {}}
        - {"class": "ZScoreNorm", "kwargs": {}}
        - {"class": "MarketCapCSRankNorm", "kwargs": {}}   # 新增
        - {"class": "Fillna", "kwargs": {}}
    filter_pipe:
        - filter_type: ExpressionDFilter
          rule_expression: "($volume > 0) * ($close < $up_limit) * ($is_st == 0) * ($is_new == 0)"
          filter_start_time:
          filter_end_time:
          keep: false
    label: ["Ref($close, -6) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 5
    backtest:
        start_time: 2025-01-01
        end_time: 2025-12-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.00015
            close_cost: 0.00015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.1
            num_boost_round: 2000
            early_stopping_rounds: 80
            subsample: 0.8789
            lambda_l1: 3
            lambda_l2: 8
            max_depth: 7
            num_leaves: 80
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158Full
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2018-01-01, 2023-12-20]
                valid: [2024-01-01, 2024-12-20]
                test:  [2025-01-01, 2025-12-31]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config